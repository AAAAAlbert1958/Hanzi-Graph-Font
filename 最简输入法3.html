<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>图 → 汉字 · 反向翻译</title>
<style>
  *{box-sizing:border-box;}
  html,body{-webkit-text-size-adjust:100%;}
  body{
    margin:0;min-height:100vh;background:#f5f7fa;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:18px 14px 40px;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }
  h1{font-size:1.1rem;font-weight:600;color:#023047;margin:0 0 4px;}
  .sub{font-size:.8rem;color:#94a3b8;margin:0 0 16px;text-align:center;line-height:1.6;}

  .wrap{
    width:min(94vw,860px);
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-areas:"board side";
    gap:18px;
    align-items:start;
  }
  @media (max-width:680px){
    .wrap{grid-template-columns:1fr;grid-template-areas:"board" "side";gap:14px;}
  }

  .board-box{
    grid-area:board;
    background:#fff;border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
    padding:10px;
  }
  svg#board{display:block;width:100%;height:auto;touch-action:none;cursor:pointer;}

  .side{
    grid-area:side;
    display:flex;flex-direction:column;gap:12px;
  }

  .result{
    background:#fff;border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
    padding:18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;min-height:148px;
  }
  .char{
    font-size:clamp(64px,16vw,112px);line-height:1;
    color:#023047;
    font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif;
    min-height:1em;
    transition:transform .15s ease,color .15s ease;
  }
  .char.flash{transform:scale(1.08);color:#2a9d8f;}
  .meta{font-size:.76rem;color:#94a3b8;text-align:center;line-height:1.7;}

  .btn-row{display:flex;gap:10px;}
  button{
    font:inherit;font-size:.85rem;padding:10px 18px;border-radius:10px;
    border:1.5px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer;
    transition:background .15s,border-color .15s,transform .08s;
    -webkit-user-select:none;user-select:none;
  }
  button:hover{border-color:#8ecae6;color:#023047;}
  button:active{transform:scale(.97);}
  .btn-row button{flex:1;}
  button.primary{background:#023047;border-color:#023047;color:#fff;font-weight:500;}
  button.primary:hover{background:#0a4a6e;border-color:#0a4a6e;color:#fff;}

  .buffer-box{
    background:#fff;border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
    padding:12px;
    display:flex;flex-direction:column;gap:8px;
  }
  .buffer-head{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.8rem;color:#334155;
  }
  .buffer-count{color:#94a3b8;font-size:.76rem;}
  #buffer{
    width:100%;
    min-height:96px;max-height:220px;
    resize:vertical;
    padding:10px 12px;
    font-size:18px;line-height:1.5;
    border:2px solid #cbd5e1;border-radius:10px;
    font-family:inherit;color:#023047;background:#fff;
    -webkit-user-select:text;user-select:text;
  }
  #buffer:focus{
    outline:none;border-color:#8ecae6;
    box-shadow:0 0 0 3px rgba(142,202,230,.3);
  }
  .buffer-actions{display:flex;align-items:center;gap:10px;}

  /* 随机补全 */
  .suggest-box{
    background:#fff;border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
    padding:12px;
    display:flex;flex-direction:column;gap:8px;
  }
  .suggest-list{
    display:flex;flex-wrap:wrap;gap:8px;
    min-height:44px;
    align-items:center;
  }
  .suggest-btn{
    font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif;
    font-size:22px;
    width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid #cbd5e1;border-radius:10px;
    background:#fff;color:#023047;
    cursor:pointer;
    transition:.15s;
    -webkit-user-select:none;user-select:none;
    padding:0;
  }
  .suggest-btn:hover{border-color:#8ecae6;background:#eaf4fa;}
  .suggest-btn:active{transform:scale(.95);}
  .suggest-empty{font-size:.8rem;color:#b0bccb;}

  .toast{
    position:fixed;left:50%;bottom:26px;
    transform:translateX(-50%) translateY(8px);
    background:#023047;color:#fff;
    padding:8px 20px;border-radius:999px;
    font-size:.82rem;white-space:nowrap;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
    z-index:100;
    box-shadow:0 6px 20px rgba(2,48,71,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .hint{font-size:.74rem;color:#b0bccb;margin-top:18px;text-align:center;line-height:1.8;}
</style>
</head>
<body>

<h1>图 → 汉字</h1>
<p class="sub">点两个端点连线 · 或按住一个点拖到另一个点 · 再点一次取消</p>

<div class="wrap">
  <div class="board-box">
    <svg id="board" viewBox="0 0 100 100"></svg>
  </div>

  <div class="side">
    <div class="result">
      <div class="char" id="charOut">一</div>
      <div class="meta" id="meta">1 个节点 · 0 条边</div>
    </div>

    <div class="btn-row">
      <button id="confirmBtn" class="primary">确认</button>
      <button id="clearBtn">清空</button>
    </div>

    <!-- 随机补全 -->
    <div class="suggest-box">
      <div class="buffer-head">
        <span>随机补全</span>
        <span class="buffer-count" id="suggestCount"></span>
      </div>
      <div class="suggest-list" id="suggestList"></div>
    </div>

    <div class="buffer-box">
      <div class="buffer-head">
        <span>缓冲栏</span>
        <span class="buffer-count" id="bufferCount"></span>
      </div>
      <textarea id="buffer" placeholder="确认后的字会追加到这里，可直接编辑……"></textarea>
      <div class="buffer-actions">
        <button id="copyBtn">复制全部</button>
      </div>
    </div>
  </div>
</div>

<p class="hint">不连通的节点会被自动丢弃 · 空图对应「一」</p>

<div class="toast" id="toast"></div>

/* ============================================================
   2) 生成所有 n<=6 的连通标号简单无向图（与原文件完全一致的排序）
   ============================================================ */
function isConnected(n, edges) {
  const adj = Array.from({ length: n }, () => []);
  for (const [u, v] of edges) { adj[u - 1].push(v - 1); adj[v - 1].push(u - 1); }
  const seen = new Array(n).fill(false);
  const stack = [0]; seen[0] = true; let cnt = 1;
  while (stack.length) {
    const u = stack.pop();
    for (const v of adj[u]) if (!seen[v]) { seen[v] = true; cnt++; stack.push(v); }
  }
  return cnt === n;
}

function edgeKey(edges) {
  return edges.map(([u, v]) => {
    const a = Math.min(u, v), b = Math.max(u, v);
    return a + '-' + b;
  }).sort().join(',');
}

function buildAllGraphs() {
  const all = [];
  for (let n = 1; n <= 6; n++) {
    const nodes = [];
    for (let i = 1; i <= n; i++) nodes.push(i);
    const possible = [];
    for (let i = 0; i < n; i++)
      for (let j = i + 1; j < n; j++)
        possible.push([nodes[i], nodes[j]]);
    const E = possible.length;
    const total = 1 << E;
    for (let mask = 0; mask < total; mask++) {
      const edges = [];
      for (let i = 0; i < E; i++) if (mask & (1 << i)) edges.push(possible[i]);
      if (isConnected(n, edges)) all.push({ n, edges });
    }
  }
  all.sort((a, b) => {
    if (a.n !== b.n) return a.n - b.n;
    if (a.edges.length !== b.edges.length) return a.edges.length - b.edges.length;
    return edgeKey(a.edges).localeCompare(edgeKey(b.edges));
  });
  return all;
}

/* ============================================================
   3) 画板：六边形布局
   ============================================================ */
const CX = 50, CY = 50, RAD = 38;
const NODE_R = 6;
const POS = {};
for (let i = 1; i <= 6; i++) {
  const a = -Math.PI / 2 + (i - 1) * Math.PI / 3;
  POS[i] = [CX + RAD * Math.cos(a), CY + RAD * Math.sin(a)];
}

let edgeSet  = new Set();   // "a-b" (a<b)
let selected = null;        // 已选中的节点
let dragFrom = null;        // 本次按下的起点
let hoverPos = null;        // 指针位置（用于预览线）

/* ---------- 命中检测 ---------- */
function nodeAt(clientX, clientY) {
  const rect = board.getBoundingClientRect();
  const x = (clientX - rect.left) / rect.width  * 100;
  const y = (clientY - rect.top ) / rect.height * 100;
  let best = null, bestD = Infinity;
  for (let i = 1; i <= 6; i++) {
    const d = Math.hypot(POS[i][0] - x, POS[i][1] - y);
    if (d < bestD) { bestD = d; best = i; }
  }
  return bestD <= 12 ? best : null;
}

/* ---------- 绘制 ---------- */
let pendingDraw = false;
function requestDraw() {
  if (pendingDraw) return;
  pendingDraw = true;
  requestAnimationFrame(() => { pendingDraw = false; draw(); });
}

function draw() {
  const used = new Set();
  for (const k of edgeSet) {
    const [a, b] = k.split('-').map(Number);
    used.add(a); used.add(b);
  }

  let s = '';

  /* 边 */
  for (const k of edgeSet) {
    const [a, b] = k.split('-').map(Number);
    const [x1, y1] = POS[a], [x2, y2] = POS[b];
    s += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="#023047" stroke-width="4" stroke-linecap="round"/>`;
  }

  /* 预览虚线 */
  if (selected !== null && hoverPos) {
    const [x1, y1] = POS[selected];
    s += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${hoverPos[0].toFixed(2)}" y2="${hoverPos[1].toFixed(2)}" stroke="#8ecae6" stroke-width="2.6" stroke-dasharray="4 4" stroke-linecap="round"/>`;
  }

  /* 节点 */
  for (let i = 1; i <= 6; i++) {
    const [x, y] = POS[i];
    const isSel = (selected === i);
    const isUsed = used.has(i);
    const fill = isSel ? '#ffb703' : (isUsed ? '#8ecae6' : '#eaf4fa');
    const r = isSel ? 7.6 : NODE_R;
    s += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${r}" fill="${fill}" stroke="#023047" stroke-width="2.6"/>`;
  }

  board.innerHTML = s;
}

/* ============================================================
   4) 归一化：丢弃不连通部分，并把标签压紧为 1..k
   ============================================================ */
function normalizeGraph(rawEdges) {
  if (rawEdges.length === 0) return { n: 1, edges: [] };

  const adj = new Map();
  for (const [a, b] of rawEdges) {
    if (!adj.has(a)) adj.set(a, []);
    if (!adj.has(b)) adj.set(b, []);
    adj.get(a).push(b);
    adj.get(b).push(a);
  }

  const seen = new Set();
  const comps = [];
  for (const start of adj.keys()) {
    if (seen.has(start)) continue;
    const comp = [];
    const stack = [start];
    seen.add(start);
    while (stack.length) {
      const u = stack.pop();
      comp.push(u);
      for (const v of adj.get(u)) {
        if (!seen.has(v)) { seen.add(v); stack.push(v); }
      }
    }
    comps.push(comp);
  }

  comps.sort((A, B) => (B.length - A.length) || (Math.min(...A) - Math.min(...B)));
  const comp = comps[0];
  const inComp = new Set(comp);

  const sorted = [...comp].sort((a, b) => a - b);
  const remap = new Map();
  sorted.forEach((v, i) => remap.set(v, i + 1));

  const seenE = new Set();
  const edges = [];
  for (const [a, b] of rawEdges) {
    if (!inComp.has(a) || !inComp.has(b)) continue;
    let u = remap.get(a), v = remap.get(b);
    if (u > v) { const t = u; u = v; v = t; }
    const k = u + '-' + v;
    if (seenE.has(k)) continue;
    seenE.add(k);
    edges.push([u, v]);
  }
  edges.sort((x, y) => (x[0] - y[0]) || (x[1] - y[1]));

  return { n: sorted.length, edges };
}

/* ============================================================
   5) 组合工具
   ============================================================ */
function combinations(n, k) {
  const result = [];
  if (k < 0 || k > n) return result;
  const idx = Array.from({ length: k }, (_, i) => i);
  while (true) {
    result.push(idx.slice());
    let i = k - 1;
    while (i >= 0 && idx[i] === i + n - k) i--;
    if (i < 0) break;
    idx[i]++;
    for (let j = i + 1; j < k; j++) idx[j] = idx[j - 1] + 1;
  }
  return result;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ============================================================
   6) 计算随机补全备选字
   ============================================================ */
function computeSuggestions() {
  const currentChar = charOut.textContent;

  const allEdges = [];
  for (let i = 1; i <= 6; i++)
    for (let j = i + 1; j <= 6; j++)
      allEdges.push(i + '-' + j);

  const present = new Set(edgeSet);
  const missing = allEdges.filter(k => !present.has(k));
  const m = missing.length;
  if (m === 0) return [];

  const pool = [];
  const poolSet = new Set();

  for (let k = 1; k <= m; k++) {
    const combos = combinations(m, k);
    // 组合数过大时随机抽样，保证性能
    let useCombos = combos;
    if (combos.length > 8000) {
      shuffle(combos);
      useCombos = combos.slice(0, 8000);
    }

    const chars = new Set();
    for (const combo of useCombos) {
      const added = combo.map(i => missing[i]);
      const newEdges = [...edgeSet, ...added].map(s => s.split('-').map(Number));
      const g = normalizeGraph(newEdges);
      const key = g.n + ':' + edgeKey(g.edges);
      const idx = LOOKUP.get(key);
      if (idx === undefined) continue;
      const ch = CHAR_AT[idx];
      if (!ch) continue;
      if (ch === currentChar) continue;
      if (poolSet.has(ch)) continue;
      chars.add(ch);
    }

    const charsArr = [...chars];
    shuffle(charsArr);

    const remain = 10 - pool.length;
    if (remain <= 0) break;

    if (charsArr.length <= remain) {
      for (const ch of charsArr) {
        if (!poolSet.has(ch)) {
          pool.push(ch);
          poolSet.add(ch);
        }
      }
    } else {
      for (let i = 0; i < remain; i++) {
        const ch = charsArr[i];
        if (!poolSet.has(ch)) {
          pool.push(ch);
          poolSet.add(ch);
        }
      }
      break;
    }
    if (pool.length >= 10) break;
  }

  shuffle(pool);
  return pool;
}

function updateSuggestions() {
  const chars = computeSuggestions();
  renderSuggestions(chars);
}

function renderSuggestions(chars) {
  if (chars.length === 0) {
    suggestListEl.innerHTML = '<span class="suggest-empty">无可补全的字</span>';
    suggestCountEl.textContent = '';
    return;
  }
  suggestListEl.innerHTML = '';
  for (const ch of chars) {
    const btn = document.createElement('button');
    btn.className = 'suggest-btn';
    btn.textContent = ch;
    btn.addEventListener('click', () => {
      appendCharToBuffer(ch);
    });
    suggestListEl.appendChild(btn);
  }
  suggestCountEl.textContent = `${chars.length} 个备选`;
}

/* ============================================================
   7) 更新结果（当前画板 -> 汉字）
   ============================================================ */
function update() {
  const raw = [...edgeSet].map(k => k.split('-').map(Number));
  const g = normalizeGraph(raw);

  const key = g.n + ':' + edgeKey(g.edges);
  const idx = LOOKUP.get(key);

  if (idx === undefined) {
    charOut.textContent = '？';
    metaEl.textContent = `${g.n} 个节点 · ${g.edges.length} 条边`;
    updateSuggestions();
    return;
  }

  const ch = CHAR_AT[idx];
  charOut.textContent = ch || '？';

  let info = `${g.n} 个节点 · ${g.edges.length} 条边`;
  if (!ch) info += ' · 该图超出字表范围';
  else info += ` · 第 ${idx + 1} 号图`;
  metaEl.textContent = info;

  updateSuggestions();
}

/* ============================================================
   8) 交互：连线
   ============================================================ */
function toggleEdge(a, b) {
  if (a === b) return;
  const lo = Math.min(a, b), hi = Math.max(a, b);
  const k = lo + '-' + hi;
  if (edgeSet.has(k)) edgeSet.delete(k);
  else edgeSet.add(k);
  update();
}

board.addEventListener('pointerdown', e => {
  e.preventDefault();
  const v = nodeAt(e.clientX, e.clientY);

  if (v === null) {
    if (selected !== null) { selected = null; hoverPos = null; draw(); }
    return;
  }

  if (selected === null) {
    selected = v;
    dragFrom = v;
  } else if (selected === v) {
    selected = null;
    dragFrom = null;
  } else {
    toggleEdge(selected, v);
    selected = null;
    dragFrom = null;
  }
  hoverPos = null;
  draw();
});

board.addEventListener('pointermove', e => {
  if (selected === null) return;
  const rect = board.getBoundingClientRect();
  hoverPos = [
    (e.clientX - rect.left) / rect.width  * 100,
    (e.clientY - rect.top ) / rect.height * 100
  ];
  requestDraw();
});

window.addEventListener('pointerup', e => {
  if (dragFrom === null) return;
  const v = nodeAt(e.clientX, e.clientY);
  if (v !== null && v !== dragFrom) {
    toggleEdge(dragFrom, v);
    selected = null;
    hoverPos = null;
  }
  dragFrom = null;
  draw();
});

window.addEventListener('pointercancel', () => {
  dragFrom = null;
  hoverPos = null;
  draw();
});

/* ============================================================
   9) 确认 / 清空 / 缓冲栏 / 复制 / 备选输入
   ============================================================ */
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
}

function flashChar() {
  charOut.classList.add('flash');
  setTimeout(() => charOut.classList.remove('flash'), 220);
}

function updateBufferCount() {
  const len = Array.from(bufferEl.value).length;
  bufferCount.textContent = len ? `${len} 字` : '';
}

function clearBoard() {
  edgeSet.clear();
  selected = null;
  dragFrom = null;
  hoverPos = null;
  update();
  draw();
}

function appendCharToBuffer(ch) {
  bufferEl.value += ch;
  updateBufferCount();
  /* showToast(`已输入「${ch}」`); */
  flashChar();
  clearBoard();
}

confirmBtn.addEventListener('click', () => {
  const ch = charOut.textContent;
  if (!ch || ch === '？') return;

  bufferEl.value += ch;
  updateBufferCount();
  flashChar();
  showToast(`已添加「${ch}」`);

  clearBoard();

  bufferEl.focus();
  bufferEl.setSelectionRange(bufferEl.value.length, bufferEl.value.length);
});

clearBtn.addEventListener('click', () => {
  clearBoard();
  showToast('画板已清空');
});

bufferEl.addEventListener('input', updateBufferCount);

copyBtn.addEventListener('click', async () => {
  const text = bufferEl.value;
  if (!text) {
    showToast('缓冲栏为空');
    return;
  }

  let ok = false;
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (_) { ok = false; }
  }

  if (!ok) {
    const s = bufferEl.selectionStart, e = bufferEl.selectionEnd;
    bufferEl.focus();
    bufferEl.select();
    try { ok = document.execCommand('copy'); }
    catch (_) { ok = false; }
    bufferEl.setSelectionRange(s, e);
  }

  showToast(ok ? '已复制到剪贴板 ✓' : '复制失败，请手动选择');
});

/* ============================================================
   10) 启动
   ============================================================ */
draw();
update();
updateBufferCount();
</script>
